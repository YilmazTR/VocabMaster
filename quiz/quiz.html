<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="quiz.css">
  <title>VocabMaster Quiz</title>
</head>
<body>
  <div class="container">
    <h1>Vocabulary Quiz</h1>
    
    <div id="quiz-setup">
      <p>Ready to test your knowledge?</p>
      <button id="btn-start">Start Quiz</button>
    </div>

    <div id="quiz-container" class="card" style="display: none;">
      <div id="question-area">
        <h2 id="target-word">Word</h2>
        <div id="options-area">
          <!-- Options will be generated here -->
        </div>
      </div>
      <div id="feedback-area" style="margin-top: 20px; font-weight: bold;"></div>
      <div id="score-area" style="margin-top: 10px;">
        Score: <span id="current-score">0</span> / <span id="total-asked">0</span>
      </div>
    </div>

    <div id="quiz-result" class="card" style="display: none;">
      <h2>Quiz Finished!</h2>
      <p id="final-score-text"></p>
      <button id="btn-restart">Restart</button>
    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
